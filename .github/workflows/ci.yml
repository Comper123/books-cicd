name: CI

on:
  push:
    branches:
      - main
      - "docs/**"
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: python:3.11.10-slim

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Показать версию Python и коммит
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"

      - name: Проверить Python-файлы
        run: python -m compileall -q .

      - name: Проверить README.md
        run: test -f README.md

      - name: Проверить app.py
        run: test -s app.py

  unit_tests:
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: python:3.11.10-slim

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v

  package:
    needs: unit_tests
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: python:3.11.10-slim

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Проверить секрет и переменную
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test -n "$DEPLOY_TOKEN"
          test "$APP_PORT" = "8102"
          echo "Секрет и переменная настроены"

      - name: Создать папку dist
        run: mkdir dist

      - name: Скопировать файлы
        run: |
          cp books.py dist/
          cp README.md dist/
          cp Dockerfile dist/
          cp books.json.example dist/

      - name: Создать manifest.txt
        run: |
          echo "COMMIT=$GITHUB_SHA" > dist/manifest.txt
          echo "RUN_ID=$GITHUB_RUN_ID" >> dist/manifest.txt
          echo "FILES:" >> dist/manifest.txt
          echo "books.py" >> dist/manifest.txt
          echo "README.md" >> dist/manifest.txt
          echo "Dockerfile" >> dist/manifest.txt
          echo "books.json.example" >> dist/manifest.txt

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: books-package
          path: dist/
          retention-days: 7
          
  deploy_test:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: python:3.11.10-slim

    environment:
      name: test/books
      url: https://github.com/Comper123/books-cicd/actions

    steps:
      - name: Скачать артефакт
        uses: actions/download-artifact@v4
        with:
          name: books-package
          path: dist

      - name: Проверить токен
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$DEPLOY_TOKEN"

      - name: Скопировать файлы
        run: |
          mkdir -p deploy/test
          cp -r dist/* deploy/test/

      - name: Выполнить дымовую проверку
        env:
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          python deploy/test/books.py --help > deploy/test/deployment.txt
          python deploy/test/books.py deploy/test/books.json.example --author "пушкин" >> deploy/test/deployment.txt
          echo "APP_PORT=$APP_PORT" >> deploy/test/deployment.txt
          echo "DEPLOYMENT=SUCCESS" >> deploy/test/deployment.txt
          cat deploy/test/deployment.txt

      - name: Сохранить результат развёртывания
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deploy/test/deployment.txt
          retention-days: 7